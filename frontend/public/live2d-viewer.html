<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS Hiyori Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
    #status {
      position: fixed; bottom: 4px; left: 0; right: 0;
      text-align: center; font-family: monospace; font-size: 10px;
      color: rgba(185,228,255,0.4); pointer-events: none; z-index: 9;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="status"></div>

  <!-- Local 100% Offline Live2D Stack -->
  <script src="live2d/core/live2dcubismcore.min.js"></script>
  <script src="live2d/core/pixi.min.js"></script>
  <script src="live2d/core/cubism4.min.js"></script>

  <script>
    const canvas = document.getElementById('canvas');
    const statusEl = document.getElementById('status');

    let app = null;
    let model = null;
    let currentState = 'SLEEPING';
    let speakInterval = null;

    const STATE_MOTION = {
      SLEEPING:    { group: 'Idle',    idx: 0, priority: 1 },
      LISTENING:   { group: 'Idle',    idx: 1, priority: 1 },
      PROCESSING:  { group: 'Idle',    idx: 2, priority: 1 },
      SPEAKING:    { group: 'TapBody', idx: 0, priority: 3 },
      QUEUED:      { group: 'Idle',    idx: 0, priority: 1 },
      READY:       { group: 'Idle',    idx: 0, priority: 1 },
    };

    async function init() {
      try {
        if (!window.Live2DCubismCore || !window.PIXI || !window.PIXI.live2d) {
          throw new Error('Live2D runtime libraries not ready');
        }

        const { Application } = PIXI;
        const { Live2DModel } = PIXI.live2d;

        app = new Application({
          view: canvas,
          autoStart: true,
          backgroundAlpha: 0,
          width: canvas.clientWidth || 300,
          height: canvas.clientHeight || 420,
          resolution: window.devicePixelRatio || 1,
          autoDensity: true,
          antialias: true,
        });

        const resizeObserver = new ResizeObserver(() => {
          if (app && app.renderer) {
            app.renderer.resize(canvas.clientWidth, canvas.clientHeight);
            layoutModel();
          }
        });
        resizeObserver.observe(canvas);

        model = await Live2DModel.from('live2d/hiyori/Hiyori.model3.json', {
          autoInteract: false,
        });

        app.stage.addChild(model);
        layoutModel();

        try {
          model.motion('Idle', 0, 1);
        } catch (e) {}

        statusEl.textContent = '';
      } catch (err) {
        statusEl.textContent = 'Avatar error: ' + err.message;
        console.error(err);
      }
    }

    function layoutModel() {
      if (!model || !app) return;
      const w = app.screen.width;
      const h = app.screen.height;

      const scale = (h / model.height) * 0.95;
      model.scale.set(scale);
      model.anchor.set(0.5, 1.0);
      model.x = w / 2;
      model.y = h;
    }

    function applyState(state) {
      if (!model) return;
      currentState = state;

      if (speakInterval) {
        clearInterval(speakInterval);
        speakInterval = null;
      }

      const m = STATE_MOTION[state] || STATE_MOTION.SLEEPING;
      try {
        model.motion(m.group, m.idx, m.priority);
      } catch (e) {}

      if (state === 'SPEAKING') {
        let phase = 0;
        speakInterval = setInterval(() => {
          if (!model?.internalModel?.coreModel) return;
          phase += 0.25;
          const val = Math.abs(Math.sin(phase)) * 0.85;
          try {
            model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', val);
          } catch {}
        }, 50);
      } else {
        try {
          model?.internalModel?.coreModel?.setParameterValueById('ParamMouthOpenY', 0);
        } catch {}
      }
    }

    window.addEventListener('message', (e) => {
      if (e.data?.type === 'JARVIS_STATE') {
        applyState(e.data.state);
      }
    });

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
